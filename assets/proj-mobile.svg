<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <rect width="400" height="220" fill="#0b1120"/>
  <!-- Phone 1 (iPhone frame) -->
  <g transform="translate(130, 15)">
    <rect width="140" height="190" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <!-- Dynamic island notch -->
    <rect x="50" y="8" width="40" height="10" rx="5" fill="#090d16"/>
    <!-- App UI -->
    <rect x="15" y="28" width="110" height="40" rx="8" fill="#2563eb" opacity="0.2"/>
    <text x="70" y="52" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Flutter Store</text>
    
    <!-- Product Grid in App -->
    <rect x="15" y="76" width="50" height="50" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="40" y="105" font-size="18" text-anchor="middle">👟</text>
    <rect x="75" y="76" width="50" height="50" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="100" y="105" font-size="18" text-anchor="middle">⌚</text>

    <!-- Buy Button in App -->
    <rect x="15" y="136" width="110" height="26" rx="6" fill="#10b981"/>
    <text x="70" y="153" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Checkout $180</text>
  </g>

  <!-- Floating Elements -->
  <circle cx="70" cy="70" r="28" fill="#0284c7" opacity="0.15"/>
  <text x="70" y="76" font-size="22" text-anchor="middle">📱</text>
  <circle cx="330" cy="140" r="28" fill="#10b981" opacity="0.15"/>
  <text x="330" y="146" font-size="22" text-anchor="middle">💳</text>
</svg>
