<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="neonEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Circle / Glow -->
  <rect width="500" height="500" rx="40" fill="url(#avatarBg)"/>
  <circle cx="250" cy="220" r="170" fill="url(#neonCyan)" opacity="0.12" filter="url(#glow)"/>
  <circle cx="340" cy="340" r="120" fill="url(#neonEmerald)" opacity="0.12" filter="url(#glow)"/>

  <!-- Geometric Grid Pattern -->
  <path d="M50 100 L450 100 M50 200 L450 200 M50 300 L450 300 M50 400 L450 400" stroke="#334155" stroke-width="1" stroke-dasharray="4 8" opacity="0.4"/>
  <path d="M100 50 L100 450 M200 50 L200 450 M300 50 L300 450 M400 50 L400 450" stroke="#334155" stroke-width="1" stroke-dasharray="4 8" opacity="0.4"/>

  <!-- Stylized Developer Persona -->
  <!-- Shoulders / Body -->
  <path d="M140 430 C140 340, 200 320, 250 320 C300 320, 360 340, 360 430 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <path d="M210 325 L250 380 L290 325 Z" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>

  <!-- Head / Face -->
  <ellipse cx="250" cy="210" rx="65" ry="75" fill="#fbcfe8" opacity="0.9"/>
  <!-- Hair & Beard -->
  <path d="M185 200 C180 130, 230 110, 250 110 C270 110, 320 130, 315 200 C300 150, 200 150, 185 200 Z" fill="#0f172a"/>
  <!-- Glasses -->
  <rect x="200" y="195" width="40" height="25" rx="6" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <rect x="260" y="195" width="40" height="25" rx="6" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <line x1="240" y1="207" x2="260" y2="207" stroke="#38bdf8" stroke-width="3"/>

  <!-- Beard Trim -->
  <path d="M205 230 C205 285, 295 285, 295 230 C275 270, 225 270, 205 230 Z" fill="#1e293b"/>

  <!-- Laptop with Code & Ledger -->
  <path d="M150 420 L350 420 L370 470 L130 470 Z" fill="#334155" stroke="#475569" stroke-width="2"/>
  <rect x="170" y="360" width="160" height="60" rx="6" fill="#090d16" stroke="#38bdf8" stroke-width="2"/>
  <!-- Code lines on laptop -->
  <line x1="185" y1="378" x2="245" y2="378" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <line x1="185" y1="390" x2="280" y2="390" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
  <line x1="185" y1="402" x2="225" y2="402" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/>

  <!-- Floating Tech / Business Badges -->
  <!-- Flutter Badge -->
  <g transform="translate(60, 140)">
    <rect width="90" height="40" rx="20" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow)"/>
    <text x="45" y="25" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Flutter</text>
  </g>

  <!-- Accounting Ledger Badge -->
  <g transform="translate(340, 130)">
    <rect width="105" height="40" rx="20" fill="#0f172a" stroke="#34d399" stroke-width="1.5" filter="url(#glow)"/>
    <text x="52" y="25" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">SQL + Ledger</text>
  </g>

  <!-- UI/UX Badge -->
  <g transform="translate(330, 280)">
    <rect width="95" height="40" rx="20" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5" filter="url(#glow)"/>
    <text x="47" y="25" fill="#a78bfa" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">UI/UX Design</text>
  </g>

  <!-- Full-Stack Badge -->
  <g transform="translate(50, 270)">
    <rect width="100" height="40" rx="20" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" filter="url(#glow)"/>
    <text x="50" y="25" fill="#f59e0b" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Full-Stack</text>
  </g>
</svg>
