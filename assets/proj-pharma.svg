<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <rect width="400" height="220" fill="#061e1b"/>
  <!-- Top bar -->
  <rect width="400" height="28" fill="#0f3933"/>
  <circle cx="15" cy="14" r="4" fill="#10b981"/>
  <text x="200" y="18" fill="#a7f3d0" font-family="sans-serif" font-size="10" text-anchor="middle">Pharma &amp; Clinic Billing System</text>

  <!-- Content cards -->
  <g transform="translate(25, 45)">
    <rect width="165" height="150" rx="10" fill="#0b2e29" stroke="#134e44" stroke-width="1.5"/>
    <text x="20" y="30" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold">💊 Drug Stock &amp; Batches</text>
    <rect x="20" y="45" width="125" height="25" rx="4" fill="#061e1b"/>
    <text x="28" y="61" fill="#e2e8f0" font-family="sans-serif" font-size="9">Amoxicillin 500mg • 420 pk</text>

    <rect x="20" y="78" width="125" height="25" rx="4" fill="#061e1b"/>
    <text x="28" y="94" fill="#e2e8f0" font-family="sans-serif" font-size="9">Paracetamol Syrip • 180 pk</text>

    <rect x="20" y="112" width="125" height="22" rx="4" fill="#10b981" opacity="0.2"/>
    <text x="28" y="127" fill="#34d399" font-family="sans-serif" font-size="9" font-weight="bold">Expiry Warning: 0 items</text>
  </g>

  <g transform="translate(210, 45)">
    <rect width="165" height="150" rx="10" fill="#0b2e29" stroke="#134e44" stroke-width="1.5"/>
    <text x="20" y="30" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">🧾 Instant Invoice POS</text>
    <rect x="20" y="45" width="125" height="60" rx="4" fill="#061e1b"/>
    <text x="28" y="65" fill="#94a3b8" font-family="sans-serif" font-size="9">Subtotal: $45.00</text>
    <text x="28" y="80" fill="#94a3b8" font-family="sans-serif" font-size="9">Tax / VAT (5%): $2.25</text>
    <text x="28" y="97" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="bold">Total: $47.25</text>

    <rect x="20" y="115" width="125" height="24" rx="4" fill="#10b981"/>
    <text x="82" y="131" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Print Rx Invoice</text>
  </g>
</svg>
