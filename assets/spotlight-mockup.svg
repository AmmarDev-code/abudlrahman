<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect width="600" height="420" rx="20" fill="#0b1120"/>

  <!-- Top Window Header -->
  <rect width="600" height="40" rx="20" fill="#1e293b"/>
  <rect y="20" width="600" height="20" fill="#1e293b"/>
  <circle cx="25" cy="20" r="5" fill="#ef4444"/>
  <circle cx="45" cy="20" r="5" fill="#f59e0b"/>
  <circle cx="65" cy="20" r="5" fill="#10b981"/>
  <text x="300" y="25" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Scalable Accounting E-Commerce Architecture (Real-Time Ledger Sync)</text>

  <!-- Node 1: Mobile App (Flutter) -->
  <g transform="translate(40, 70)">
    <rect width="140" height="130" rx="14" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="55" y="15" width="30" height="30" rx="8" fill="#3b82f6" opacity="0.2"/>
    <text x="70" y="35" fill="#3b82f6" font-size="16" text-anchor="middle">📱</text>
    <text x="70" y="65" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Flutter App</text>
    <text x="70" y="85" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">iOS & Android</text>
    <text x="70" y="105" fill="#38bdf8" font-family="sans-serif" font-size="9" text-anchor="middle">Client & Cashier POS</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M190 135 L240 135" stroke="url(#lineGrad)" stroke-width="3" stroke-dasharray="4 4"/>
  <polygon points="245,135 235,130 235,140" fill="#10b981"/>

  <!-- Node 2: Backend API (Node / PHP) -->
  <g transform="translate(250, 70)">
    <rect width="140" height="130" rx="14" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5"/>
    <rect x="55" y="15" width="30" height="30" rx="8" fill="#10b981" opacity="0.2"/>
    <text x="70" y="35" fill="#10b981" font-size="16" text-anchor="middle">⚙️</text>
    <text x="70" y="65" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">RESTful Core</text>
    <text x="70" y="85" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Node.js / PHP</text>
    <text x="70" y="105" fill="#34d399" font-family="sans-serif" font-size="9" text-anchor="middle">ACID Transactions</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M400 135 L450 135" stroke="url(#lineGrad)" stroke-width="3" stroke-dasharray="4 4"/>
  <polygon points="455,135 445,130 445,140" fill="#8b5cf6"/>

  <!-- Node 3: SQL Database -->
  <g transform="translate(460, 70)">
    <rect width="110" height="130" rx="14" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="40" y="15" width="30" height="30" rx="8" fill="#8b5cf6" opacity="0.2"/>
    <text x="55" y="35" fill="#8b5cf6" font-size="16" text-anchor="middle">🗄️</text>
    <text x="55" y="65" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">SQL DB</text>
    <text x="55" y="85" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Double-Entry</text>
    <text x="55" y="105" fill="#a78bfa" font-family="sans-serif" font-size="9" text-anchor="middle">Financial Schema</text>
  </g>

  <!-- Lower Panel: Real-Time Ledger Sync Visualizer -->
  <g transform="translate(40, 230)">
    <rect width="520" height="160" rx="14" fill="#070b14" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="520" height="35" rx="14" fill="#1e293b"/>
    <rect x="0" y="20" width="520" height="15" fill="#1e293b"/>
    <text x="20" y="23" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">⚡ Automated Journal Flow on Order Placement:</text>

    <!-- Step 1 -->
    <g transform="translate(20, 50)">
      <circle cx="15" cy="15" r="12" fill="#2563eb" opacity="0.2"/>
      <text x="15" y="19" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">1</text>
      <text x="35" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="11">Order Completed by Customer / Cashier</text>
    </g>

    <!-- Step 2 -->
    <g transform="translate(20, 85)">
      <circle cx="15" cy="15" r="12" fill="#10b981" opacity="0.2"/>
      <text x="15" y="19" fill="#34d399" font-size="11" font-weight="bold" text-anchor="middle">2</text>
      <text x="35" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="11">Instant Ledger: DR Cash Account / CR Sales Revenue Account</text>
    </g>

    <!-- Step 3 -->
    <g transform="translate(20, 120)">
      <circle cx="15" cy="15" r="12" fill="#8b5cf6" opacity="0.2"/>
      <text x="15" y="19" fill="#a78bfa" font-size="11" font-weight="bold" text-anchor="middle">3</text>
      <text x="35" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="11">COGS Adjustment: DR Cost of Goods Sold / CR Inventory Asset</text>
    </g>
  </g>
</svg>
