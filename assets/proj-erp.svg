<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <rect width="400" height="220" fill="#0f172a"/>
  <!-- Top bar -->
  <rect width="400" height="28" fill="#1e293b"/>
  <circle cx="15" cy="14" r="4" fill="#ef4444"/>
  <circle cx="30" cy="14" r="4" fill="#f59e0b"/>
  <circle cx="45" cy="14" r="4" fill="#10b981"/>
  <text x="200" y="18" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">Smart ERP &amp; Cashier Dashboard</text>
  
  <!-- Stats Row -->
  <rect x="20" y="45" width="105" height="45" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="32" y="62" fill="#94a3b8" font-family="sans-serif" font-size="9">Total Revenue</text>
  <text x="32" y="80" fill="#10b981" font-family="sans-serif" font-size="14" font-weight="bold">$48,250</text>
  
  <rect x="145" y="45" width="105" height="45" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="157" y="62" fill="#94a3b8" font-family="sans-serif" font-size="9">Invoices Today</text>
  <text x="157" y="80" fill="#3b82f6" font-family="sans-serif" font-size="14" font-weight="bold">142 Orders</text>
  
  <rect x="270" y="45" width="110" height="45" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="282" y="62" fill="#94a3b8" font-family="sans-serif" font-size="9">Trial Balance</text>
  <text x="282" y="80" fill="#8b5cf6" font-family="sans-serif" font-size="12" font-weight="bold">Reconciled ✔</text>

  <!-- Chart / Graph Area -->
  <rect x="20" y="105" width="360" height="95" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  <!-- Bars -->
  <rect x="45" y="150" width="18" height="40" rx="3" fill="#3b82f6"/>
  <rect x="85" y="130" width="18" height="60" rx="3" fill="#3b82f6"/>
  <rect x="125" y="140" width="18" height="50" rx="3" fill="#3b82f6"/>
  <rect x="165" y="120" width="18" height="70" rx="3" fill="#10b981"/>
  <rect x="205" y="115" width="18" height="75" rx="3" fill="#10b981"/>
  <rect x="245" y="135" width="18" height="55" rx="3" fill="#3b82f6"/>
  <rect x="285" y="125" width="18" height="65" rx="3" fill="#8b5cf6"/>
  <rect x="325" y="110" width="18" height="80" rx="3" fill="#8b5cf6"/>
</svg>
